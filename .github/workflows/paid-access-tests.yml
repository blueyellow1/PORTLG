name: PORTLG Paid Access Tests

on:
  push:
    branches: ["paid-access-tpot"]
    paths:
      - "backend/**"
      - "tests/test_paid_access.py"
      - "requirements.txt"
      - ".github/workflows/paid-access-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "tests/test_paid_access.py"
      - "requirements.txt"
      - ".github/workflows/paid-access-tests.yml"

jobs:
  paid-access-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Paid Access tests
        run: python -m unittest tests.test_paid_access -v
